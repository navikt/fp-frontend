name: Bygg og deploy fp-avdelingsleder
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/fp-avdelingsleder/**'
      - 'packages/**'
      - 'server/**'
      - '.deploy/fp-avdelingsleder/**'
      - '.deploy/naiserator.yaml'
      - '.github/workflows/build-fp-avdelingsleder.yml'
      - '.github/workflows/build.yml'
      - 'turbo.json'
      - 'Dockerfile'
      - 'yarn.lock'

jobs:
  build-app:
    name: Build
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      runs-on: 'ubuntu-latest'
      build-image: ${{ github.ref_name == 'master' }} # default: true
      push-image: ${{ github.ref_name == 'master' }} # default: false
      app: fp-avdelingsleder
      image_suffix: '/fp-avdelingsleder'
      # Bakes inn i asset-referansene (renderBuiltUrl) slik at fp-avdelingsleder laster assets fra CDN.
      # Må matche upload-to-CDN destination (teamforeldrepenger + /fp-avdelingsleder).
      vite-cdn-url: 'https://cdn.nav.no/teamforeldrepenger/fp-avdelingsleder/'
  upload-to-CDN:
    name: Upload assets to CDN
    if: github.ref_name == 'master'
    needs: build-app
    permissions:
      contents: read
      id-token: write
    uses: navikt/fp-gha-workflows/.github/workflows/cdn-upload.yml@main
    with:
      image: ${{ needs.build-app.outputs.build-version }}
      image_suffix: '/fp-avdelingsleder'
      destination: '/fp-avdelingsleder'

  deploy-dev:
    name: Deploy dev
    permissions:
      contents: read
      id-token: write
    if: github.ref_name == 'master'
    needs: [build-app, upload-to-CDN]
    uses: navikt/fp-gha-workflows/.github/workflows/deploy.yml@main
    with:
      gar: true
      image: ${{ needs.build-app.outputs.build-version }}
      cluster: dev-gcp
      image_suffix: '/fp-avdelingsleder'
      deploy_context: '/fp-avdelingsleder'

  deploy-prod:
    name: Deploy prod
    permissions:
      contents: read
      id-token: write
    if: github.ref_name == 'master'
    needs: [build-app, deploy-dev]
    uses: navikt/fp-gha-workflows/.github/workflows/deploy.yml@main
    with:
      gar: true
      image: ${{ needs.build-app.outputs.build-version }}
      cluster: prod-gcp
      image_suffix: '/fp-avdelingsleder'
      deploy_context: '/fp-avdelingsleder'
