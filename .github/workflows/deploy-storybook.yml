name: 'Deploy storybook'

on:
  push:
    branches: ['master']
  workflow_dispatch:

jobs:
  deploy-storybook:
    permissions:
      contents: write
      pages: write
      id-token: write
      packages: read
    uses: navikt/fp-gha-workflows/.github/workflows/deploy-storybook.yml@main
    with:
      package-manager: yarn
      cache: turbo
      node-version: 26
