name: Bygg og deploy branch manuelt
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name'
        type: string
        required: true
      app:
        required: true
        type: choice
        description: 'Applikasjon som skal deployes fra branch'
        options:
          - fp-frontend
          - fp-avdelingsleder
          - fp-journalforing

jobs:
  build-app:
    name: Build
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      runs-on: 'ubuntu-latest-8-cores'
      push-image: true
      branch: ${{ inputs.branch }}
      app: '${{ inputs.app }}'
      image_suffix: '/${{ inputs.app }}'
      # Alle apper bakar CDN-URL inn i assets (jf. build-<app>.yml).
      vite-cdn-url: 'https://cdn.nav.no/teamforeldrepenger/${{ inputs.app }}/'
  upload-to-CDN:
    name: Upload assets to CDN
    needs: build-app
    permissions:
      contents: read
      id-token: write
    uses: navikt/fp-gha-workflows/.github/workflows/cdn-upload.yml@main
    with:
      image: ${{ needs.build-app.outputs.build-version }}
      image_suffix: '/${{ inputs.app }}'
      destination: '/${{ inputs.app }}'

  deploy-dev:
    name: Deploy dev
    permissions:
      id-token: write
    needs: [build-app, upload-to-CDN]
    uses: navikt/fp-gha-workflows/.github/workflows/deploy.yml@main
    with:
      gar: true
      branch: ${{ inputs.branch }}
      image: ${{ needs.build-app.outputs.build-version }}
      cluster: dev-gcp
      image_suffix: '/${{ inputs.app }}'
      deploy_context: '/${{ inputs.app }}'
